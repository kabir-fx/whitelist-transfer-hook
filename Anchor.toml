[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
whitelist_transfer_hook = "DhzyDgCmmQzVC4vEcj2zRGUyN8Mt5JynfdGLKkBcRGaX"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
cron = "yarn run ts-node cron/cron.ts --cronName tuktuk-counter-cron --queueName tuktuk-counter --walletPath ~/.config/solana/id.json --rpcUrl https://api.devnet.solana.com --userToWhitelist Bm3PBYtPwN17nkSvsogNgk1ycLBgf3BTNpwnrNzZnMRp"

[test]
startup_wait = 10000

[test.validator]
url = "https://api.devnet.solana.com"
bind_address = "127.0.0.1"

[[test.genesis]]
address = "tuktukUrfhXT6ZT77QTU8RQtvgL967uRuVagWF57zVA"
program = "tests/fixtures/tuktuk.so"

[[test.validator.clone]]
address = "CMreFdKxT5oeZhiX8nWTGz9PtXM1AMYTh6dGR2UzdtrA"
